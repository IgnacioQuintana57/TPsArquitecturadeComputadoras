<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="460" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">imem = Instruction Memory (memoria de programa)</text>
  <text x="380" y="52" text-anchor="middle" font-size="13" fill="#555555">Un armario con 256 cajones; cada cajón guarda UNA instrucción de 32 bits</text>

  <!-- PC -->
  <rect x="30" y="110" width="170" height="110" rx="8" fill="#e8f0fe" stroke="#1a56db" stroke-width="2"/>
  <text x="115" y="135" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a56db">PC</text>
  <text x="115" y="158" text-anchor="middle" font-size="12" fill="#333333">dirección en BYTES</text>
  <text x="115" y="185" text-anchor="middle" font-size="18" font-family="Consolas, monospace" fill="#1a1a1a">8 = 0000 10<tspan fill="#c2410c" font-weight="bold">00</tspan></text>
  <text x="115" y="207" text-anchor="middle" font-size="11" fill="#c2410c">los 2 bits bajos siempre son 00</text>

  <!-- arrow -->
  <line x1="200" y1="165" x2="300" y2="165" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
  <text x="250" y="150" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#1a1a1a">pc[9:2]</text>
  <text x="250" y="186" text-anchor="middle" font-size="11" fill="#555555">÷ 4 → nº de cajón</text>
  <text x="250" y="202" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#1a1a1a">= 2</text>

  <!-- imem drawers -->
  <rect x="300" y="75" width="260" height="330" rx="8" fill="#f8f9fa" stroke="#333333" stroke-width="2"/>
  <text x="430" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">imem (256 × 32 bits)</text>

  <rect x="315" y="108" width="230" height="40" rx="4" fill="#ffffff" stroke="#999999"/>
  <text x="325" y="125" font-size="12" font-weight="bold" fill="#555555">cajón 0 (PC=0)</text>
  <text x="325" y="141" font-size="12" font-family="Consolas, monospace" fill="#1a1a1a">addi x1, x0, 5</text>

  <rect x="315" y="154" width="230" height="40" rx="4" fill="#ffffff" stroke="#999999"/>
  <text x="325" y="171" font-size="12" font-weight="bold" fill="#555555">cajón 1 (PC=4)</text>
  <text x="325" y="187" font-size="12" font-family="Consolas, monospace" fill="#1a1a1a">add  x2, x1, x1</text>

  <rect x="315" y="200" width="230" height="40" rx="4" fill="#fff4e5" stroke="#c2410c" stroke-width="3"/>
  <text x="325" y="217" font-size="12" font-weight="bold" fill="#c2410c">cajón 2 (PC=8)  ← elegido</text>
  <text x="325" y="233" font-size="12" font-family="Consolas, monospace" fill="#1a1a1a">sub  x3, x2, x1</text>

  <rect x="315" y="246" width="230" height="40" rx="4" fill="#ffffff" stroke="#999999"/>
  <text x="325" y="263" font-size="12" font-weight="bold" fill="#555555">cajón 3 (PC=12)</text>
  <text x="325" y="279" font-size="12" font-family="Consolas, monospace" fill="#1a1a1a">...</text>

  <text x="430" y="312" text-anchor="middle" font-size="18" fill="#555555">⋮</text>

  <rect x="315" y="326" width="230" height="40" rx="4" fill="#ffffff" stroke="#999999"/>
  <text x="325" y="343" font-size="12" font-weight="bold" fill="#555555">cajón 255 (PC=1020)</text>
  <text x="325" y="359" font-size="12" font-family="Consolas, monospace" fill="#1a1a1a">vacío = 0x00000000 = NOP</text>

  <text x="430" y="392" text-anchor="middle" font-size="11" fill="#555555">lectura asincrónica: sale sin esperar al clock</text>

  <!-- output -->
  <line x1="560" y1="220" x2="620" y2="220" stroke="#1a1a1a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="625" y="170" width="110" height="100" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="680" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#188038">o_instr</text>
  <text x="680" y="218" text-anchor="middle" font-size="12" fill="#333333">32 bits</text>
  <text x="680" y="238" text-anchor="middle" font-size="11" fill="#333333">→ latch IF/ID</text>
  <text x="680" y="256" text-anchor="middle" font-size="11" fill="#333333">(instrucción sub)</text>

  <text x="380" y="438" text-anchor="middle" font-size="13" fill="#1a1a1a">Para no olvidarlo: imem = programa · dmem = datos · el PC dice qué cajón de la imem leer</text>
</svg>
